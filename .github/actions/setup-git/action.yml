name: Set up pinned Git
description: Install the repository's Git 2.55.0 prerequisite from verified upstream archives
runs:
  using: composite
  steps:
    - name: Install Git for Windows 2.55.0(5)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $archive = Join-Path $env:RUNNER_TEMP 'mingit.zip'
        $destination = Join-Path $env:RUNNER_TEMP 'prmonitor-git'
        Invoke-WebRequest 'https://github.com/git-for-windows/git/releases/download/v2.55.0.windows.5/MinGit-2.55.0.5-64-bit.zip' -OutFile $archive
        # Published by git-for-windows/git, release v2.55.0.windows.5.
        $expected = '56d7b226b7693196cfc71fef26568f536c4a021ab6c37ff2db4287bed908e96e'
        if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
          throw 'Git archive checksum mismatch'
        }
        Expand-Archive $archive -DestinationPath $destination -Force
        (Join-Path $destination 'cmd') | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
    - name: Build Git 2.55.0 on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install --yes build-essential libcurl4-openssl-dev libexpat1-dev gettext libssl-dev zlib1g-dev
        cd "$RUNNER_TEMP"
        curl --fail --location --retry 3 https://www.kernel.org/pub/software/scm/git/git-2.55.0.tar.xz -o git-2.55.0.tar.xz
        # Published in kernel.org/pub/software/scm/git/sha256sums.asc.
        echo '457fdb04dc8728e007d4688695e6912e6f680727920f2a40bf11eacc17505357  git-2.55.0.tar.xz' | sha256sum --check --strict
        tar -xf git-2.55.0.tar.xz
        make -C git-2.55.0 -j2 prefix="$RUNNER_TEMP/prmonitor-git" NO_TCLTK=YesPlease NO_RUST=YesPlease install
        echo "$RUNNER_TEMP/prmonitor-git/bin" >> "$GITHUB_PATH"
    - name: Verify pinned Git on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $expected = Join-Path $env:RUNNER_TEMP 'prmonitor-git/cmd/git.exe'
        if ((Get-Command git.exe).Source -ne $expected) { throw 'Pinned Git is not first on PATH' }
        if ((git --version) -ne 'git version 2.55.0.windows.5') { throw 'Unexpected Git version' }
    - name: Verify pinned Git on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        git --version
        git --version | grep -E '^git version 2\.55\.0([. ].*)?$'
