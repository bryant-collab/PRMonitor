name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows foundation check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-git
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm run check
      - name: Build shipping NSIS installer (no release)
        run: npm --workspace @prmonitor/desktop run package:installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Shipping Start menu shortcut acceptance
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          ./tests/installer-shortcuts.ps1 -Installer "release/PRMonitor-$version-x64.exe"
      - name: Setup startup and restart acceptance
        run: npm run test:setup

  ubuntu:
    name: Ubuntu Xvfb foundation check
    # Approved temporary compatibility pin; retire before 2027-04-17.
    # Evidence and migration exit criteria: docs/evidence/backlog/ubuntu-runner-pin.md
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-git
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install --yes xvfb
      - run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" npm run check
      - name: Read-only Linux sandbox diagnostics
        if: always()
        run: node scripts/linux-sandbox-diagnostics.mjs
