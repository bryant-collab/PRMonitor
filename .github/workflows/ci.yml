name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows foundation check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-git
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm run check
      - name: Setup startup and restart acceptance
        run: npm run test:setup
  windows-installer:
    name: Windows shipping installer acceptance
    # A clean account is required: Electron notification initialization creates
    # a Start menu link even during read-only Notification.isSupported().
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-git
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm run check:runtime
      - run: npm run build:validation-contract
      - run: npm run build:desktop
      - name: Build shipping NSIS installer (no release)
        run: npm --workspace @prmonitor/desktop run package:installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Prepare installer upgrade fixtures (no release)
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'prmonitor-shortcut-packages'
          New-Item -ItemType Directory -Path $fixture | Out-Null
          $preview = Join-Path $fixture 'preview.2.exe'
          Invoke-WebRequest 'https://github.com/bryant-collab/PRMonitor/releases/download/v0.1.0-preview.2/PRMonitor-0.1.0-x64.exe' -OutFile $preview
          $expected = 'c88f8eb67902475436f42ae875d4c9e18c7a9b0012dbf99849db84cb7086fba0'
          if ((Get-FileHash $preview -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Preview.2 installer checksum mismatch' }
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $parts = $version.Split('.')
          $upgradeVersion = "$($parts[0]).$($parts[1]).$([int]$parts[2] + 1)"
          Push-Location apps/desktop
          try {
            npx --no-install electron-builder --publish never --win nsis --x64 --config electron-builder.yml "--config.extraMetadata.version=$upgradeVersion" "--config.directories.output=$fixture"
            if ($LASTEXITCODE -ne 0) { throw 'Upgrade fixture packaging failed.' }
          } finally { Pop-Location }
          "PRMONITOR_UPGRADE_VERSION=$upgradeVersion" >> $env:GITHUB_ENV
          "PRMONITOR_SHORTCUT_PACKAGES=$fixture" >> $env:GITHUB_ENV
      - name: Shipping Start menu shortcut acceptance
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          ./tests/installer-shortcuts.ps1 -Installer "release/PRMonitor-$version-x64.exe" -CandidateVersion $version -PreviewInstaller "$env:PRMONITOR_SHORTCUT_PACKAGES/preview.2.exe" -UpgradeInstaller "$env:PRMONITOR_SHORTCUT_PACKAGES/PRMonitor-$env:PRMONITOR_UPGRADE_VERSION-x64.exe" -UpgradeVersion $env:PRMONITOR_UPGRADE_VERSION
      - name: Checksum review installer
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $name = "PRMonitor-$version-x64.exe"
          $hash = (Get-FileHash "release/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content "release/$name.sha256" -Encoding ascii
      - name: Retain unsigned review installer (no release)
        uses: actions/upload-artifact@v4
        with:
          name: windows-review-installer-${{ github.sha }}
          path: |
            release/PRMonitor-*-x64.exe
            release/PRMonitor-*-x64.exe.sha256
          if-no-files-found: error
          retention-days: 1
  ubuntu:
    name: Ubuntu Xvfb foundation check
    # Approved temporary compatibility pin; retire before 2027-04-17.
    # Evidence and migration exit criteria: docs/evidence/backlog/ubuntu-runner-pin.md
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-git
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install --yes xvfb
      - run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" npm run check
      - name: Read-only Linux sandbox diagnostics
        if: always()
        run: node scripts/linux-sandbox-diagnostics.mjs
