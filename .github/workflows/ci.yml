name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows foundation check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm run check

  ubuntu:
    name: Ubuntu Xvfb foundation check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install --yes xvfb
      - run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" npm run check
