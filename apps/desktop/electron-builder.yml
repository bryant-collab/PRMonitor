appId: com.prmonitor.desktop
productName: PRMonitor
executableName: PRMonitor
artifactName: PRMonitor-${version}-${arch}.${ext}
directories:
  output: ../../release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
extraResources:
  - from: build/prmonitor.png
    to: prmonitor.png
win:
  icon: build/prmonitor.png
  signAndEditExecutable: false
  signExecutable: false
  forceCodeSigning: false
  target:
    - target: dir
      arch:
        - x64
    - target: nsis
      arch:
        - x64
nsis:
  include: installer.nsh
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PRMonitor
  runAfterFinish: false
  deleteAppDataOnUninstall: false
linux:
  target:
    - target: dir
      arch:
        - x64
mac:
  target:
    - target: dir
      arch:
        - x64
