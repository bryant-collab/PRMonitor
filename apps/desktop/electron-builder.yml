appId: com.prmonitor.desktop
productName: PRMonitor
directories:
  output: ../../release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
win:
  signAndEditExecutable: false
  forceCodeSigning: false
  target:
    - target: dir
      arch:
        - x64
linux:
  target:
    - target: dir
      arch:
        - x64
mac:
  target:
    - target: dir
      arch:
        - x64
